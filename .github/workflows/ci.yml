name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coreai
          POSTGRES_PASSWORD: coreai
          POSTGRES_DB: coreai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coreai -d coreai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://coreai:coreai@127.0.0.1:5432/coreai
      SESSION_SECRET: ci-session-secret-at-least-32-bytes
      JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long
      API_KEY_PEPPER: ci-api-key-pepper-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: ruff check app tests alembic
      - run: alembic check
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Compose
        env:
          VLLM_API_KEY: ci-placeholder
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate production Compose
        working-directory: deploy
        env:
          COREAI_PROD_ENV_FILE: .env.prod.example
        run: docker compose --env-file .env.prod.example -f compose.production.yml config --quiet
