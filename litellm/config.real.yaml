# CoreAI-owned routing for local development. The two base URLs point at Mac-side
# SSH tunnels that terminate on the inference VM's loopback-bound raw vLLM ports.
model_list:
  - model_name: gemma4-31b-it
    litellm_params:
      model: openai/gemma-4-31B-it
      api_base: os.environ/GEMMA_INFERENCE_BASE_URL
      api_key: os.environ/VLLM_API_KEY

  - model_name: qwen3.6-35b-a3b
    litellm_params:
      model: openai/qwen3.6-35b-a3b
      api_base: os.environ/QWEN_INFERENCE_BASE_URL
      api_key: os.environ/VLLM_API_KEY

router_settings:
  num_retries: 1
  timeout: 600
  stream_timeout: 600

litellm_settings:
  drop_params: false
  telemetry: false

general_settings:
  disable_spend_logs: true
