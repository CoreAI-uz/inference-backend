name: coreai-inference

# Production stack for chat.coreai.uz. Only Caddy is exposed to the host;
# Postgres/Redis/MinIO are internal-only. Config comes from deploy/.env.prod
# (copy .env.prod.example). CoreAI talks to the central LiteLLM service below;
# LiteLLM alone knows the raw inference worker endpoints.
#
#   cd deploy && cp .env.prod.example .env.prod   # then edit secrets + worker routes
#   ./preflight.sh
#   docker compose --env-file .env.prod -f compose.production.yml up -d --build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      API_SITE_ADDRESS: ${API_SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # One-shot: apply DB migrations before the backend starts.
  migrate:
    build:
      context: ../backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  backend:
    build:
      context: ../backend
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w ${WEB_CONCURRENCY:-4}
      -b 0.0.0.0:8000
      --timeout 120 --graceful-timeout 30
    restart: unless-stopped
    env_file: ${COREAI_PROD_ENV_FILE:-.env.prod}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    logging: *default-logging

  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.92.0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GEMMA_INFERENCE_BASE_URL: ${GEMMA_INFERENCE_BASE_URL}
      QWEN_INFERENCE_BASE_URL: ${QWEN_INFERENCE_BASE_URL}
      VLLM_API_KEY: ${VLLM_API_KEY}
    expose:
      - "4000"
    volumes:
      - ../litellm/config.production.yaml:/app/config.yaml:ro
    depends_on:
      inference-tunnel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    logging: *default-logging

  # Encrypted route to loopback-bound vLLM workers on the GPU VM. The mounted
  # SSH key is restricted server-side to forwarding ports 18001 and 18002 only.
  inference-tunnel:
    build:
      context: ./tunnel
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    command:
      - -NT
      - -g
      - -o
      - BatchMode=yes
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - ServerAliveInterval=30
      - -o
      - ServerAliveCountMax=3
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile=/run/secrets/known_hosts
      - -i
      - /run/secrets/id_ed25519
      - -p
      - ${INFERENCE_SSH_PORT:-22}
      - -L
      - 0.0.0.0:18001:127.0.0.1:18001
      - -L
      - 0.0.0.0:18002:127.0.0.1:18002
      - ${INFERENCE_SSH_USER}@${INFERENCE_SSH_HOST}
    volumes:
      - ${INFERENCE_SSH_PRIVATE_KEY_PATH}:/run/secrets/id_ed25519:ro
      - ${INFERENCE_SSH_KNOWN_HOSTS_PATH}:/run/secrets/known_hosts:ro
    expose:
      - "18001"
      - "18002"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 18001 && nc -z 127.0.0.1 18002"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-coreai} -d $${POSTGRES_DB:-coreai}"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    logging: *default-logging

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb --ignore-existing local/$${MINIO_BUCKET:-ocr-uploads};
      echo 'minio bucket ready';
      "
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
