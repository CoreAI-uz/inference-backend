[project]
name = "coreai-inference-backend"
version = "0.1.0"
description = "CoreAI Inference — FastAPI backend (streaming chat + compatible API)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # long lines (config JSON, prompts) are fine

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection API intentionally uses call expressions as defaults.
"app/api/*.py" = ["B008"]
"app/auth/*.py" = ["B008"]
"app/gateway/ratelimit.py" = ["B008"]
"app/openai_api/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
